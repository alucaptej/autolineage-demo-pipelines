# Spark properties for all pipeline jobs (spark-submit --properties-file).
# Secrets (DataHub token) are injected by run.sh from the environment — never here.

spark.master                                local[1]
spark.driver.memory                         1g
spark.ui.enabled                            false

# Delta Lake
spark.sql.extensions                        io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog             org.apache.spark.sql.delta.catalog.DeltaCatalog

# DataHub lineage emission
spark.extraListeners                        datahub.spark.DatahubSparkListener
spark.datahub.rest.server                   http://localhost:8080
spark.datahub.metadata.dataset.materialize  true
