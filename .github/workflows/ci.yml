name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --quiet "pyspark==3.5.6" "delta-spark==3.3.2" ruff pytest
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest tests/ -q
